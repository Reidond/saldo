name: Check and deploy Saldo

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  CLOUDFLARE_SEND_METRICS: "false"
  DOCKER_DEFAULT_PLATFORM: linux/amd64

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out source without persisted credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
      - name: Enable the pinned pnpm from packageManager
        run: corepack enable pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run check
      - name: Require additive-only database migrations
        run: node scripts/ci/migrations.ts
      - name: Build the Linux amd64 bridge image
        run: docker build --platform linux/amd64 --file apps/bridge/Dockerfile --tag saldo-ai-bridge:ci .
      - name: Smoke-test rejection paths without network access
        run: node scripts/ci/smoke-image.ts

  deploy:
    needs: check
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 35
    environment: saldo-production
    concurrency:
      group: saldo-production
      cancel-in-progress: false
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      SALDO_D1_DATABASE_ID: ${{ vars.SALDO_D1_DATABASE_ID }}
      SALDO_RELEASE_TAG: ${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - name: Check out the checked commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
      - name: Require the protected Environment token
        env:
          TOKEN_CONFIGURED: ${{ secrets.CLOUDFLARE_API_TOKEN != '' }}
        run: test "$TOKEN_CONFIGURED" = true
      - name: Enable the pinned pnpm from packageManager
        run: corepack enable pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run check
      - run: node scripts/ci/migrations.ts
      - name: Build the exact bridge source on Linux amd64
        run: docker build --platform linux/amd64 --file apps/bridge/Dockerfile --tag saldo-ai-bridge:ci .
      - run: node scripts/ci/smoke-image.ts
      - name: Refuse an outdated main commit before any mutation
        run: node scripts/ci/deployment.ts current-main
      - name: Verify live private settings and D1 recovery point
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: node scripts/ci/deployment.ts prepare
      - name: Apply additive migrations sequentially
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: node scripts/ci/deployment.ts migrate
      - name: Deploy the private bridge and Container
        uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0 # v4.1.3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "4.148.0"
          packageManager: pnpm
          quiet: true
          command: deploy --config apps/bridge/wrangler.jsonc --keep-vars --containers-rollout immediate
      - name: Upload and activate the app without changing domain routes
        uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0 # v4.1.3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "4.148.0"
          packageManager: pnpm
          quiet: true
          command: |
            versions upload --config "${{ runner.temp }}/saldo-app.wrangler.json" --keep-vars --tag "${{ env.SALDO_RELEASE_TAG }}"
            versions deploy --config "${{ runner.temp }}/saldo-app.wrangler.json" --version-tag "${{ env.SALDO_RELEASE_TAG }}" --percentage 100 --yes
      - name: Verify preserved settings and anonymous access denial
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: node scripts/ci/deployment.ts verify
      - name: Remove ephemeral private configuration
        if: always()
        run: rm -f "$RUNNER_TEMP/saldo-app.wrangler.json" "$RUNNER_TEMP/saldo-production-snapshot.json"
