name: Check and deploy Saldo

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  CF_SEND_TELEMETRY: "false"
  DOCKER_DEFAULT_PLATFORM: linux/amd64

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out source without persisted credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
      - name: Enable the pinned pnpm from packageManager
        run: corepack enable pnpm
      - run: pnpm install --frozen-lockfile
      - name: Check, test and cf build every Worker (bridge image included)
        run: pnpm run check
      - name: Require additive-only database migrations
        run: node scripts/ci/migrations.ts
      - name: Validate every Build Output with cf, without credentials
        run: pnpm run deploy:check
      - name: Smoke-test the built bridge image without network access
        run: node scripts/ci/smoke-image.ts

  deploy:
    needs: check
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: saldo-production
    concurrency:
      group: saldo-production
      cancel-in-progress: false
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      SALDO_D1_DATABASE_ID: ${{ vars.SALDO_D1_DATABASE_ID }}
      SALDO_APP_ORIGIN: ${{ vars.SALDO_APP_ORIGIN }}
      SALDO_ACCESS_TEAM_DOMAIN: ${{ vars.SALDO_ACCESS_TEAM_DOMAIN }}
      SALDO_RELEASE_TAG: ${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - name: Check out the checked commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
      - name: Require the protected Environment token
        env:
          TOKEN_CONFIGURED: ${{ secrets.CLOUDFLARE_API_TOKEN != '' }}
        run: test "$TOKEN_CONFIGURED" = true
      - name: Mask and validate the release settings
        env:
          SALDO_ACCESS_AUD: ${{ secrets.SALDO_ACCESS_AUD }}
          SALDO_OWNER_SUB: ${{ secrets.SALDO_OWNER_SUB }}
        run: node scripts/ci/deployment.ts settings
      - name: Enable the pinned pnpm from packageManager
        run: corepack enable pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run check
      - run: node scripts/ci/migrations.ts
      - name: Refuse an outdated main commit before any mutation
        run: node scripts/ci/deployment.ts current-main
      - name: Build the release Workers with the protected settings
        env:
          SALDO_RELEASE: production
          SALDO_ACCESS_AUD: ${{ secrets.SALDO_ACCESS_AUD }}
          SALDO_OWNER_SUB: ${{ secrets.SALDO_OWNER_SUB }}
        run: pnpm run build
      - name: Validate the release Build Output with cf, without credentials
        run: pnpm run deploy:check
      - name: Smoke-test the bridge image that will be deployed
        run: node scripts/ci/smoke-image.ts
      - name: Verify Build Output, live private settings and D1 recovery point
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          SALDO_ACCESS_AUD: ${{ secrets.SALDO_ACCESS_AUD }}
          SALDO_OWNER_SUB: ${{ secrets.SALDO_OWNER_SUB }}
        run: node scripts/ci/deployment.ts prepare
      - name: Apply additive migrations sequentially
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: node scripts/ci/deployment.ts migrate
      - name: Deploy the private bridge and Container
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: node scripts/ci/deployment.ts deploy bridge
      - name: Deploy the app without changing domain routes
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: node scripts/ci/deployment.ts deploy app
      - name: Verify preserved settings and anonymous access denial
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          SALDO_ACCESS_AUD: ${{ secrets.SALDO_ACCESS_AUD }}
          SALDO_OWNER_SUB: ${{ secrets.SALDO_OWNER_SUB }}
        run: node scripts/ci/deployment.ts verify
      - name: Remove ephemeral private state
        if: always()
        run: rm -f "$RUNNER_TEMP/saldo-production-snapshot.json"
